name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 冒烟测试 (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows 必测：requirements.txt 的 gbk 解码、路径分隔符、CRLF 都只在 Windows 上暴露
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 --status（无 config 时也应正常退出）
        run: python pipeline.py --status

      - name: 冒烟测试（含 mock 全流程、提示词一致性、requirements 编码）
        run: python tests/test_smoke.py

      - name: 检查没有意外生成 __pycache__
        shell: bash
        run: |
          if find . -name '__pycache__' -o -name '*.pyc' | grep -q .; then
            echo "::error::运行后产生了 __pycache__，会带上本机绝对路径"
            find . -name '__pycache__' -o -name '*.pyc'
            exit 1
          fi

  prompts-archive:
    name: 提示词存档与代码一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 单独一个 job 只是为了让这条检查在 PR 里有个显眼的状态名。
      # 判定逻辑**只维护一份**（tests/test_smoke.py），这里只做筛选调用，
      # 避免 CI 里再写第二套 AST 提取实现而悄悄漂移。
      - name: 校验
        run: python tests/test_smoke.py --only prompts
